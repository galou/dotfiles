set-option -g default-terminal "screen-256color"

# Free the original Ctrl-b prefix keybinding
unbind-key C-b
# setting the delay between prefix and command
set-option -s escape-time 1
# Ensure that we can send Ctrl-A to other apps
bind-key C-a send-prefix
# Lower escape timing for quicker response to scroll-buffer/vim access.
set-option -g escape-time 0

# Support for undercurl and underscrot colors.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colors - needs tmux-3.0

# Extended (CSI u) key reporting. Without this, tmux collapses Shift+Enter,
# Ctrl+Enter etc. into a bare CR, so applications that distinguish them
# (Claude Code, neovim...) only ever see a plain Enter.
#   - terminal-features extkeys: tell tmux the OUTER terminal speaks CSI u.
#   - extended-keys always:      make tmux emit CSI u to INNER applications.
# Both need tmux >= 3.2; the "always" value needs >= 3.4 ("on" before that).
if-shell -b '[ "$(tmux -V | sed "s/[^0-9]//g")" -ge 32 ]' \
	"set -as terminal-features '*:extkeys'"
if-shell -b '[ "$(tmux -V | sed "s/[^0-9]//g")" -ge 34 ]' \
	"set -s extended-keys always" \
	'if-shell -b "[ \"$(tmux -V | sed \"s/[^0-9]//g\")\" -ge 32 ]" "set -s extended-keys on"'

# tmux-256color advertises more capabilities to inner applications than
# screen-256color (which caps out at 8 colors for some of them). Guarded
# because the terminfo entry is absent on some minimal container images.
if-shell -b 'infocmp tmux-256color >/dev/null 2>&1' \
	'set-option -g default-terminal "tmux-256color"'
